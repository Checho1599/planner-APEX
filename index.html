<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner APEX · Tecnomel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app" id="app">
        <div class="header">
            <h1><i class="fas fa-calendar-check"></i> Planner APEX</h1>
            <div class="view-controls">
                <button class="view-btn active" data-view="day"><i class="fas fa-sun"></i> Día</button>
                <button class="view-btn" data-view="week"><i class="fas fa-calendar-week"></i> Semana</button>
                <button class="view-btn" data-view="month"><i class="fas fa-calendar-alt"></i> Mes</button>
            </div>
        </div>

        <div class="sync-status" id="syncStatus">
            <i class="fas fa-cloud"></i> <span id="syncText">Conectando...</span>
        </div>

        <div class="navigation">
            <button class="nav-btn" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
            <span class="nav-title" id="navTitle">Hoy</span>
            <button class="nav-btn" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
            
            <div class="date-picker-wrapper">
                <button class="nav-btn date-picker-toggle" id="datePickerToggle">
                    <i class="fas fa-calendar-alt"></i>
                </button>
                <div class="date-picker-dropdown" id="datePickerDropdown">
                    <div class="date-picker-header">
                        <button class="picker-nav" id="pickerPrevMonth"><i class="fas fa-chevron-left"></i></button>
                        <span id="pickerMonthYear">Agosto 2026</span>
                        <button class="picker-nav" id="pickerNextMonth"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <div class="date-picker-grid" id="datePickerGrid"></div>
                    <div class="date-picker-footer">
                        <button class="picker-today-btn" id="pickerTodayBtn">Hoy</button>
                    </div>
                </div>
            </div>

            <button class="nav-btn today-btn" id="todayBtn"><i class="fas fa-calendar-day"></i> Hoy</button>
        </div>

        <div id="viewContainer"></div>

        <div class="footer-actions">
            <button class="btn-outline" id="forceSyncBtn"><i class="fas fa-sync"></i> Sincronizar ahora</button>
            <button class="btn-outline" id="showPatternsBtn"><i class="fas fa-list"></i> Gestionar patrones</button>
        </div>
    </div>

    <!-- MODAL PRINCIPAL -->
    <div class="modal-overlay" id="mainModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-tasks"></i> Gestionar tarea</h3>
                <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- MODAL DE PATRONES -->
    <div class="modal-overlay" id="patternsModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3><i class="fas fa-list"></i> Patrones de tareas</h3>
                <button class="modal-close" id="patternsModalClose"><i class="fas fa-times"></i></button>
            </div>
            <div id="patternsModalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
